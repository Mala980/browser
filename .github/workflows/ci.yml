name: CI

on:
  push:
    branches-ignore: ["ci-diagnostics"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish diagnostics on ci-diagnostics
  actions: read

jobs:
  build-unit:
    name: build + unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          set -o pipefail
          make -j$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2) 2>&1 | tee /tmp/build.log
      - name: unit tests
        run: |
          set -o pipefail
          make -j$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2) build/astra-test 2>&1 | tee -a /tmp/build.log
          ./build/astra-test 2>&1 | tee /tmp/unit.log
      - name: publish diagnostics
        if: failure()
        run: |
          cat /tmp/build.log >> /tmp/unit.log 2>/dev/null || true
          bash .github/publish-log.sh "unit-${{ matrix.os }}" /tmp/unit.log
      - name: version smoke test
        run: ./build/astra version && ./build/astra info
      - uses: actions/upload-artifact@v4
        with:
          name: astra-${{ matrix.os }}
          path: build/astra

  integration-mock:
    name: control plane integration (mock engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: build
        run: make -j$(nproc)
      - name: end-to-end test against the mock CDP engine
        run: |
          set -o pipefail
          python3 tests/e2e/test_local.py 2>&1 | tee /tmp/mock.log
      - name: publish diagnostics
        if: failure()
        run: bash .github/publish-log.sh mock-e2e /tmp/mock.log

  real-browser:
    name: real Chromium end-to-end (puppeteer + go-rod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: install system libraries for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb curl python3-pip
          sudo apt-get install -y \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 \
            libcairo2 libatspi2.0-0 libxshmfence1 libasound2 || \
          sudo apt-get install -y \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 \
            libcairo2 libatspi2.0-0 libxshmfence1 libasound2t64
      - name: pillow (test asset generation)
        run: pip install --break-system-packages pillow || pip install pillow
      - name: install Chrome for Testing
        run: npx --yes @puppeteer/browsers install chrome@stable --path "$HOME/.cache/puppeteer"
      - name: build astra
        run: make -j$(nproc)
      - name: run end-to-end suite
        run: |
          set -o pipefail
          bash tests/e2e/run_real_browser_tests.sh 2>&1 | tee /tmp/e2e.log
      - name: publish diagnostics
        if: failure()
        run: |
          { echo "== astra headless =="; cat /tmp/astra-e2e/astra-headless.log 2>/dev/null;
            echo "== astra full =="; cat /tmp/astra-e2e/astra-full.log 2>/dev/null;
            echo "== site =="; cat /tmp/astra-e2e/site.log 2>/dev/null; } >> /tmp/e2e.log
          bash .github/publish-log.sh real-browser-e2e /tmp/e2e.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: /tmp/astra-e2e
