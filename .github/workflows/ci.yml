name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: build + unit tests (x86_64 linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: kilat-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.toml', 'src/**', 'build.rs') }}

      # The crate has no dependencies at all, so --offline is a build-time
      # guarantee that the same source compiles inside Termux on a phone.
      - name: Build (release, offline)
        run: |
          set -o pipefail
          cargo build --release --offline 2>&1 | tee /tmp/build.log \
            || { bash scripts/ci-report.sh /tmp/build.log; exit 1; }

      - name: Build without TLS (fallback config)
        run: cargo build --offline --no-default-features

      - name: Unit tests
        run: |
          set -o pipefail
          cargo test --offline 2>&1 | tee /tmp/test.log \
            || { bash scripts/ci-report.sh /tmp/test.log; exit 1; }

      - name: Binary selftest
        run: ./target/release/kilat selftest

      # The font fixture must stay reproducible from the generator, and the reader
      # is checked against it plus every real font the runner ships.
      - name: Font fixtures and sfnt reader
        run: |
          python3 - <<'PY'
          import filecmp, os, subprocess, tempfile
          d = tempfile.mkdtemp()
          subprocess.run(["python3", "scripts/make-font-fixture.py", d], check=True)
          for f in ("kilat-mini.ttf", "kilat-mini.woff"):
              a, b = os.path.join(d, f), os.path.join("tests/data", f)
              assert filecmp.cmp(a, b, shallow=False), f"{f} drifted from scripts/make-font-fixture.py"
          print("font fixtures are reproducible")
          PY
          ./target/release/kilat dev font-info tests/data/kilat-mini.ttf | tee /tmp/font-info.json
          grep -q '"family": "Kilat Mini"' /tmp/font-info.json
          grep -q '"covered": 4' /tmp/font-info.json
          ./target/release/kilat dev font-info tests/data/kilat-mini.woff | grep -q '"units_per_em": 1000'
          ./target/release/kilat dev fonts /usr/share/fonts

      - name: Codec cross-checks (python zlib / libjpeg / ImageMagick)
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y --no-install-recommends libjpeg-turbo-progs netpbm imagemagick >/dev/null
          bash scripts/ci-codec-crosscheck.sh ./target/release/kilat

      - name: Formatting (advisory)
        continue-on-error: true
        run: cargo fmt --all --check

      - uses: actions/upload-artifact@v4
        with:
          name: kilat-linux-x86_64
          path: target/release/kilat
          if-no-files-found: error

  syntax:
    name: rust syntax check (tree-sitter)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/check-rust.mjs src tests

  # Re-enabled once the engine, CDP server and Termux packaging land:
  #
  # e2e-cdp:
  #   uses: ./.github/workflows/e2e.yml
  # termux-arm64:
  #   uses: ./.github/workflows/termux.yml
