name: Termux (Android aarch64)

on:
  push:
    branches-ignore: ["ci-diagnostics"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish diagnostics on ci-diagnostics
  actions: read

jobs:
  ndk-cross:
    name: cross compile with the Android NDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true
      - name: build astra for aarch64-linux-android (Termux bionic)
        id: ndkbuild
        run: |
          set -o pipefail
          bash scripts/build-termux-ndk.sh 2>&1 | tee /tmp/ndk.log
      - name: publish diagnostics
        if: failure()
        run: bash .github/publish-log.sh termux-ndk /tmp/ndk.log
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: inspect the binary
        run: |
          file dist/astra || true
          ls -lh dist
      - name: smoke test under qemu-user (best effort)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static
          qemu-aarch64-static dist/astra version || \
            qemu-aarch64-static -L /dev/null dist/astra version || \
            echo "qemu smoke test not possible for this binary (bionic)"
      - uses: actions/upload-artifact@v4
        with:
          name: astra-termux-aarch64
          path: dist/*

  termux-native:
    name: native build inside Termux (best effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: resolve the Termux docker image
        id: image
        run: |
          for img in ghcr.io/termux/termux-docker:latest termux/termux-docker:latest; do
            if timeout 120 docker pull "$img" >/dev/null 2>&1; then
              echo "image=$img" >> "$GITHUB_OUTPUT"
              echo "using $img"
              exit 0
            fi
          done
          echo "no Termux docker image available on this runner - skipping native build"
          echo "image=" >> "$GITHUB_OUTPUT"
      - name: build inside Termux
        if: steps.image.outputs.image != ''
        run: |
          set +e
          # NOTE: Termux has no /bin, everything lives under $PREFIX - just call bash
          docker run --rm -v "$PWD":/src -w /src "${{ steps.image.outputs.image }}" \
            bash .github/termux-native-build.sh 2>&1 | tee /tmp/termux-native.log
          rc=${PIPESTATUS[0]}
          echo "docker exit status: $rc"
          exit "$rc"
      - name: publish log
        if: always()
        run: bash .github/publish-log.sh termux-native /tmp/termux-native.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-termux-native
          path: dist/*
