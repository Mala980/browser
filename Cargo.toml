[package]
name = "kilat"
version = "0.1.0"
edition = "2021"
description = "Kilat - a lightweight, bandwidth-frugal web browser engine with a Chrome DevTools Protocol front end (servo/lightpanda/obscura inspired)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Mala980/browser"

# IMPORTANT: zero external crates. `cargo build --offline` must always work, so
# the exact same source builds inside Termux on a phone with nothing but rust + clang.
[dependencies]

[features]
default = ["tls"]
# TLS through the system OpenSSL (loaded with dlopen at runtime, no import needed).
tls = []
# JavaScript through QuickJS (third_party/quickjs submodule + src/js/glue.c).
js = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 1
debug = 0

[lib]
name = "kilat"
path = "src/lib.rs"

[[bin]]
name = "kilat"
path = "src/main.rs"
